# Undertow — USDC/WETH 0.30% pool: the primary study pool (PLAN.md §7).
#
# Pinned window: 2022-01-01 → 2024-12-31 UTC, fully post-EIP-1559.
#
# Secrets never live in this file. When a value may come from the environment, use a ${ENV_VAR}
# placeholder that undertow.data.config.load_config expands at load time (raising ConfigError
# when the variable is unset). The expanded value is never logged or written to a manifest —
# log/record the host only.
#
# Token ordering is contractual: Uniswap orders tokens by address and 0xA0b8…eB48 (USDC) sorts
# below 0xC02a…6Cc2 (WETH), so token0 == USDC (6 dp) and token1 == WETH (18 dp). Getting this
# backwards silently inverts every price in the thesis (CONTRACTS.md §3.0 price orientation).

[pool]
address = "0x8ad599c3a0ff1de082011efddc58f1908eb6e6d8"  # USDC/WETH, 0.30%
token0_symbol = "USDC"
token1_symbol = "WETH"
token0_decimals = 6
token1_decimals = 18
fee_tier = 3000
tick_spacing = 60
deployment_block = 12370624  # pool factory creation (verified on-chain)

[window]
# Exactly one of (start_block/end_block) or (start_utc/end_utc). Dates are resolved to blocks by
# T07's block index (last block with timestamp <= end_utc); end_utc is inclusive.
start_utc = "2022-01-01T00:00:00Z"
end_utc = "2024-12-31T23:59:59Z"
# Walk-forward split hook (recorded in the manifest; drives the `pool-state` snapshot at each
# lane's first block so the backtester can seed its exact fee engine at a mid-lifecycle window).
# Only the lane STARTS matter: the eval lane starts at `eval_start_utc`, and the train lane at the
# window start, so `train_end_utc` need not equal the sim's `SplitConfig.train_end_utc`.
train_end_utc = "2024-01-01T00:00:00Z"
eval_start_utc = "2024-01-01T00:00:00Z"

[regime]
# Pre-committed thresholds (PLAN.md §7); sweepable via T12's sensitivity_sweep.
lookback_days = 30
vol_threshold = 0.80
drift_threshold = 0.05
periods_per_year = 525600  # 365 * 1440 minute bars

[reference]
# Primary Binance symbol for the price_reference join and the sim's replay/valuation
# series. The fetch keeps ETHUSDC as the cross-check, but consumers must select one
# series (data PLAN.md §7: ETHUSDT is the deepest, longest 1m history).
symbol = "ETHUSDT"

[endpoints]
# The Graph: official Uniswap v3 (Ethereum mainnet) subgraph on the decentralized network.
# T05 owns the queries; this is the GraphQL endpoint it posts to. The gateway base URL includes the
# ${GRAPH_API_KEY}; the subgraph deployment id lives in code (``SUBGRAPH_ID``, appended by
# ``TheGraphFetcher._endpoint()``) — never here, so the id is never duplicated.
graph_url = "https://gateway.thegraph.com/api/${GRAPH_API_KEY}"
rpc_url = "${ETH_RPC_URL}"  # archive node required
reference_base_url = "https://api.binance.com"
# S19: Binance USDT-M futures base for /fapi/v1/fundingRate. Public endpoint, not a
# secret, so it is a literal value rather than an ${ENV_VAR} placeholder.
futures_base_url = "https://fapi.binance.com"

[paths]
cache_dir = "data/cache/eth_usdc_3000"
output_dir = "data/datasets/eth_usdc_3000"
log_dir = "logs/eth_usdc_3000"

# Order-of-magnitude gas estimates for the NonfungiblePositionManager path (mint/burn/collect)
# plus a ballpark swap figure. Overrides the defaults in undertow.data.config.GAS_UNITS; T14 /
# undertow.sim may calibrate these against real receipts without touching code.
[gas]
tip_surcharge_pct = 3  # % uplift on base_fee_per_gas to approximate priority fees (ADR-005)

[gas.units]
mint = 400000
burn = 250000
collect = 150000
swap = 180000