# Sim config for the ETH/USDC 0.05% pool (configs/eth_usdc_500.toml) — the
# primary study pool.  Named explicitly for runs that pin the dataset.  The
# episode values match configs/sim_default.toml, but the action grid and the PPO
# update recipe are the stabilized primary-pool overrides (ADR-036): the default
# 91-action grid made hold inexplorable and the default update sizes thrashed.
# Widths are half-ranges in tick-spacing units, so spacing 10 needs the wider
# ladder to cover the same price band the 0.30% contrast pool does at spacing 60.

[episode]
duration_days = 30
step_minutes = 10
agent_capital_usdc = 100000.0
marginal_agent = true
fee_tier_bps = 500
tick_spacing = 10

[action_grid]
# ADR-011's factored grid, config-reduced for this pool: 3 centre offsets x
# 9 widths + hold = 28 actions.  The default 91-action grid made hold
# inexplorable -- the flat softmax sampled it only ~1/N of the time, so the
# policy never built the hold advantage that avoiding the per-rebalance gas
# dominates.  (ADR-011's grid itself is unchanged; only this pool's config is.)
center_offsets = [-1, 0, 1]
widths = [2, 5, 10, 25, 50, 100, 250, 500, 1000]
include_hold = true

[gas]
mint_units = 460000
burn_units = 215000
collect_units = 130000
rebalance_swap_units = 150000

[slippage]
fixed_impact_bps = 5.0

[reward]
risk_penalty_lambda = 0.0
risk_rolling_window_steps = 144
normalize_by_capital = true
fees_enabled = true
gas_enabled = true
slippage_enabled = true
il_enabled = true
risk_penalty_enabled = false

[split]
train_start_utc = 2022-01-01T00:00:00Z
train_end_utc = 2023-12-31T00:00:00Z
eval_start_utc = 2024-01-01T00:00:00Z
eval_end_utc = 2024-12-31T00:00:00Z

[training]
algorithm = "ppo"
seeds = [0, 1, 2, 3, 4]
discount_gamma = 0.99
gae_lambda = 0.95
clip_epsilon = 0.15
hidden_size = 256
n_hidden = 2
parallel_envs = 4
total_timesteps = 1000000
checkpoint_freq_steps = 100000
log_freq_steps = 10000
# Stabilized PPO update recipe (ADR-036).  The primary run thrashed: the
# captured rollout advantages correctly favoured hold (adv_hold > 0,
# adv_reb < 0) but the hold fraction flipped between ~0.51 and ~0.01
# update-to-update because a 64-sample mini-batch over 10 epochs moved the
# policy too far from the behaviour policy that collected the rollout.  Smaller
# steps, a larger batch, fewer epochs and a KL stop let the advantage signal
# dominate; on the real train env the greedy policy then held all 4320 steps
# and matched the scripted hold-only return (+0.0885).  hold_bias keeps the
# hold prior (now on a 28-action grid).
learning_rate = 0.0001
batch_size = 512
n_epochs = 4
ent_coef = 0.001
target_kl = 0.01
hold_bias = 4.0
vec_env = "subproc"

[backtest]
compute_decomposition = true
log_decision_every_step = false

[price]
mode = "replay"
