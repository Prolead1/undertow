# Sim config for the ETH/USDC 0.05 % primary pool with the joint
# (LP, hedge-ratio) head AND the S21 risk-sensitive objective (ADR-040).
#
# Derived from configs/sim_eth_usdc_500_hedged.toml; it changes exactly the
# fields below, so gas, slippage, splits, backtest and price mode stay
# identical to the S20b run:
#
#   [reward]
#     risk_penalty_enabled = true
#     risk_penalty_mode    = "cvar"   # trailing expected shortfall, not vol
#
#   [training]
#     selection_metric = "val_sharpe" # rank checkpoints on the carved
#                                     # validation window, not train reward
#
# Lambda choice (sweepable, not claimed optimal): the env returns the trailing
# empirical expected shortfall of per-step equity losses as a *positive* USDC
# magnitude, and `normalize_reward` divides every term by the 100k initial
# capital.  With a 100k book and O(0.1-1 %) 10-minute equity moves the 95 %
# CVaR is O(100-1000 USDC), so lambda=0.05 charges O(5-50 USDC) on tail
# states -- comparable to one step's fee/gas terms and strictly smaller than
# a full tail loss, enough to tilt the hedge ratio toward the drawdown-
# reducing arm without swamping the excess-vs-HODL signal.  lambda=0.5 would
# be ~10x a typical step's economics and would force the full short
# regardless of carry.  Sweep it before quoting a result.

[episode]
duration_days = 30
step_minutes = 10
agent_capital_usdc = 100000.0
marginal_agent = true
fee_tier_bps = 500
tick_spacing = 10

[action_grid]
# ADR-011's factored grid, config-reduced for this pool (ADR-036).
center_offsets = [-1, 0, 1]
widths = [2, 5, 10, 25, 50, 100, 250, 500, 1000]
include_hold = true

[gas]
mint_units = 460000
burn_units = 215000
collect_units = 130000
rebalance_swap_units = 150000

[slippage]
fixed_impact_bps = 5.0

[reward]
risk_penalty_lambda = 0.05
risk_rolling_window_steps = 144
risk_penalty_enabled = true
# S21: penalize the trailing 5 % expected shortfall of per-step equity losses
# (positive loss magnitude -> `-lambda * pnl_cvar`) instead of the trailing
# std of equity changes.  `volatility` remains the default everywhere else.
risk_penalty_mode = "cvar"
risk_cvar_alpha = 0.95
normalize_by_capital = true
fees_enabled = true
gas_enabled = true
slippage_enabled = true
il_enabled = true

[hedge]
# S20b joint head: the agent chooses the short ratio each decision.
enabled = true
fee_bps = 5.0
funding_enabled = true
ratio = 1.0
ratios = [0.0, 0.25, 0.5, 0.75, 1.0]
agent_ratio = true

[split]
train_start_utc = 2022-01-01T00:00:00Z
train_end_utc = 2023-12-31T00:00:00Z
eval_start_utc = 2024-01-01T00:00:00Z
eval_end_utc = 2024-12-31T00:00:00Z

[training]
algorithm = "ppo"
seeds = [0, 1, 2, 3, 4]
discount_gamma = 0.99
gae_lambda = 0.95
clip_epsilon = 0.15
hidden_size = 256
n_hidden = 2
parallel_envs = 4
total_timesteps = 1000000
checkpoint_freq_steps = 100000
log_freq_steps = 10000
# S21 validation-based checkpoint selection (ADR-040): the last 30 days of the
# train split are carved off and every periodic checkpoint is ranked on the
# validation window's Sharpe; the winner is copied over the canonical
# checkpoint.  The eval split is never touched.
selection_metric = "val_sharpe"
validation_days = 30
# Stabilized PPO update recipe (ADR-036), unchanged.
learning_rate = 0.0001
batch_size = 512
n_epochs = 4
ent_coef = 0.001
target_kl = 0.01
hold_bias = 4.0
vec_env = "subproc"

[backtest]
compute_decomposition = true
log_decision_every_step = false

[price]
mode = "replay"
