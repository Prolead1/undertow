# Corpus manifest for scripts/plagiarism_check.py.
#
# The checker extracts prose from report/**/*.tex and reports every run of
# `ngram` (default 8) consecutive words that also appears in a document below.
# `group = "external"` matches fail the check; `internal` matches are the repo's
# own prose and are reported as warnings.
#
# PDF sources are cached under data/plagiarism_corpus/ (gitignored). Add a new
# source only when the report actually cites it, and keep the URL to the
# open-access copy.

ngram = 8

# -- Cited papers (open access) ------------------------------------------------

[[sources]]
name = "adams2021uniswap"
group = "external"
kind = "pdf"
url = "https://uniswap.org/whitepaper-v3.pdf"
