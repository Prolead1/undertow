name: quality

# The gate: a PR cannot merge, and `main` cannot build, unless ruff is clean and
# coverage stays at or above the 90% `fail_under` configured in pyproject.toml.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src/undertow
      - name: Tests (coverage floor enforced by pyproject.toml)
        run: uv run pytest
