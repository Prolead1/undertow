[project]
name = "undertow"
version = "0.1.0"
description = "Friction-aware reinforcement learning for concentrated liquidity provision."
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=19",
    "polars>=1.0",
    "numpy>=2.0",
    "requests>=2.32",
    "tenacity>=9.0",
    "tomli-w>=1.0",
    "platformdirs>=4.0",
    "eth-utils>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
undertow-data = "undertow.data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undertow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: hits a live endpoint; deselected by default",
    "slow: > 5s",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "undertow.data.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true