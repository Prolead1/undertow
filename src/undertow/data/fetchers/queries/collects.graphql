# T05 (Route A) — one page of Collect entities for the pool over [cursorBlock, endBlock].
#
# Whether this query is usable at all depends on the subgraph indexing the Collect
# event; the `uniswap/uniswap-v3` subgraph does (the `collects` entity). If the
# subgraph id confirmed at first live pull lacks it, supported_streams() must be
# narrowed and T06 becomes the sole source for `collect`.
#
# Same pagination discipline as swaps.graphql (see that file): cursor on the
# (transaction.blockNumber, logIndex) ordering key, boundary de-dup client-side,
# `_meta` for indexer-lag detection, never `skip`.
query CollectPage($pool: String!, $cursorBlock: BigInt!, $endBlock: BigInt!, $first: Int!) {
  collects(
    first: $first
    orderBy: transaction__blockNumber
    orderDirection: asc
    where: { pool: $pool, transaction_: { blockNumber_gte: $cursorBlock, blockNumber_lte: $endBlock } }
  ) {
    id
    transaction {
      id
      blockNumber
    }
    timestamp
    logIndex
    pool {
      id
    }
    owner
    recipient
    tickLower
    tickUpper
    amount0
    amount1
  }
  _meta {
    block {
      number
    }
  }
}